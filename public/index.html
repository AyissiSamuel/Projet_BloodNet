<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodNet — Plateforme Banque de Sang</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js pour les statistiques du stock -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/js/app.js"></script>
</head>
<body>

    <!-- SYSTEME DE NOTIFICATION TOAST -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="topbar-left">
            <h1 class="logo">Blood<span>Net</span></h1>
            <span class="hospital-name"><i class="fa-solid fa-hospital" aria-hidden="true"></i> Hôpital Central de Yaoundé</span>
        </div>
        <div class="topbar-right">
            <button class="icon-btn" id="notif-btn" aria-label="Notifications (3 non lues)">
                <i class="fa-regular fa-bell" aria-hidden="true"></i>
                <span class="badge-count">3</span>
            </button>
            <div class="user-avatar" title="Session : NG">NG</div>
        </div>
    </header>

    <div class="app-container">
        <!-- SIDEBAR METIER COMPLÈTE -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-target="dashboard-home" title="Vue Générale">
                    <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
                </a>
                <a href="#" class="nav-item" data-target="stock" title="Gestion du Stock">
                    <i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i>
                </a>
                <a href="#" class="nav-item" data-target="orders" title="Commandes B2B & Drones">
                    <i class="fa-solid fa-truck-medical" aria-hidden="true"></i>
                </a>
                <a href="#" class="nav-item" data-target="donors" title="Gestion des Donneurs">
                    <i class="fa-solid fa-hand-holding-medical" aria-hidden="true"></i>
                </a>
                <a href="#" class="nav-item" data-target="settings" title="Paramètres">
                    <i class="fa-solid fa-gear" aria-hidden="true"></i>
                </a>
            </nav>
            <a href="#" id="logout-btn" class="nav-item logout" title="Déconnexion">
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            </a>
        </aside>

        <!-- ZONE DYNAMIQUE (Injectée par app.js via fetch) -->
        <main class="main-content" id="app-content">
            <div class="loading-spinner">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Chargement de votre espace...
            </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
