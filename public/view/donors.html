<div class="page-container">
    <div class="page-header">
        <div>
            <h2>Gestion des Donneurs</h2>
            <p class="subtitle">Registre des donneurs ayant contribué à votre établissement</p>
        </div>
        <button class="btn-primary" id="btn-open-donor-modal">
            <i class="fa-solid fa-user-plus"></i> Enregistrer un Don
        </button>
    </div>

    <!-- REGISTRE DES DONNEURS -->
    <div class="card-box" style="margin-top: 1.5rem;">
        <div class="table-header">
            <h3><i class="fa-solid fa-address-book"></i> Registre des Donneurs</h3>
        </div>
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Nom</th>
                        <th>Groupe</th>
                        <th>Téléphone</th>
                        <th>Dons</th>
                        <th>Dernier don</th>
                        <th>Éligibilité</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="donors-table-body">
                    <tr><td colspan="8" style="text-align:center;">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- HISTORIQUE DES DONS -->
    <div class="card-box" style="margin-top: 1.5rem;">
        <div class="table-header">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> Historique des Prélèvements</h3>
        </div>
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Donneur</th>
                        <th>Groupe</th>
                        <th>Volume</th>
                        <th>Lieu</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="donations-history-table-body">
                    <tr><td colspan="6" style="text-align:center;">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODALE : ENREGISTRER UN DON / NOUVEAU DONNEUR -->
<div class="modal-overlay" id="modal-add-donor" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-droplet"></i> Enregistrer un Don</h3>
            <button class="close-btn" id="close-donor-modal">&times;</button>
        </div>
        <form id="form-add-donor">
            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" id="donor-is-anonymous" style="width:auto;">
                <label for="donor-is-anonymous" style="margin:0;">Don anonyme</label>
            </div>

            <div id="donor-personal-info">
                <div class="form-group">
                    <label for="donor-nom">Nom complet</label>
                    <input type="text" id="donor-nom" required>
                </div>
                <div class="form-group">
                    <label for="donor-phone">Téléphone</label>
                    <input type="tel" id="donor-phone" placeholder="+237 6XX XX XX XX">
                </div>
            </div>

            <div class="form-row" style="display:flex; gap:1rem;">
                <div class="form-group" style="flex:1;">
                    <label for="donor-blood-group">Groupe Sanguin</label>
                    <select id="donor-blood-group" required>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label for="donor-volume">Volume prélevé (mL)</label>
                    <input type="number" id="donor-volume" value="450" min="100" max="500" required>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="cancel-donor-modal">Annuler</button>
                <button type="submit" class="btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
